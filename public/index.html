<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - ULS Clinic System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login-theme.js"></script>
    <script src="js/ui.js" defer></script>
    <script src="js/login-effects.js" defer></script>
    <script src="js/clinic-api.js" defer></script>
    <script src="js/staff-login.js" defer></script>
</head>

<body class="login-page">
    <div class="login-birds" aria-hidden="true"></div>
    <main class="login" aria-labelledby="portal-title">
        <div class="login-brand">
            <img class="login-brand-image" src="css/ulslogo.png" alt="University of La Salette Logo" width="100"
                height="100">
            <h1 id="portal-title">ULS Clinic Portal</h1>
            <p>University Health Services</p>
        </div>
        <div class="login-divider" aria-hidden="true"></div>
        <h2 id="login-heading">Welcome back</h2>
        <p class="login-intro" id="login-subtitle">Select your portal and enter your credentials.</p>

        <nav class="login-portals" aria-label="Choose portal">
            <button type="button" class="role-link" data-role="doctor" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M15 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-3A3.5 3.5 0 0 0 5 18.5V20" />
                    <circle cx="10" cy="7" r="3.5" />
                    <path d="M17 8h5m-2.5-2.5v5M17 15a3 3 0 1 0 3 3v-1" />
                </svg>
                <span>Doctor</span>
            </button>
            <button type="button" class="role-link" data-role="nurse" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="16" rx="3" />
                    <path d="M12 8v8m-4-4h8" />
                    <path d="M8 4V2m8 2V2" />
                </svg>
                <span>Nurse</span>
            </button>
        </nav>

        <form class="f" id="staff-login">
            <div class="login-field">
                <label for="u">ID number</label>
                <div class="input-with-icon">
                    <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M5 21v-2a7 7 0 0 1 14 0v2" />
                    </svg>
                    <input id="u" name="username" autocomplete="username" placeholder="Enter your ID or username"
                        required>
                </div>
            </div>
            <div class="login-field">
                <label for="p">Password</label>
                <div class="input-with-icon password-field">
                    <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="4" y="10" width="16" height="11" rx="2" />
                        <path d="M8 10V7a4 4 0 1 1 8 0v3m-4 4v3" />
                    </svg>
                    <input class="password-input" id="p" name="password" type="password" autocomplete="current-password"
                        placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password"
                        aria-pressed="false">
                        <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6Z" />
                            <circle cx="12" cy="12" r="2.5" />
                        </svg>
                        <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path
                                d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3 3.5M6.2 6.2C3.5 8 2 12 2 12s3.6 6 10 6c1.2 0 2.3-.2 3.3-.6" />
                            <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                        </svg>
                    </button>
                </div>
            </div>
            <p class="alert" id="login-message" role="alert" hidden></p>
            <button class="btn login-submit" type="submit">Sign in</button>
        </form>
        <p class="login-footer">Authorized access only</p>
    </main>
</body>

</html>
